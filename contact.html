{% extends "base.html" %}
{% block title %}تماس با ما{% endblock %}
{% block content %}
<section>
  <h2>تماس با ما</h2>
  <p class="sub">سؤال یا پیشنهادی داری؟ برایمان بنویس.</p>
  <form id="contact-form">
    <input name="name" placeholder="نام شما" required maxlength="100">
    <input name="email" type="email" placeholder="ایمیل" required maxlength="200">
    <textarea name="message" rows="4" placeholder="پیام شما" required maxlength="3000"></textarea>
    <button class="btn" type="submit">ارسال پیام</button>
    <div id="status" role="status"></div>
  </form>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/contact.js') }}"></script>{% endblock %}
