<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyHub{% endblock %} | StudyHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

<header>
  <nav>
    <a class="logo" href="{{ url_for('index') }}">StudyHub 📚</a>
    <ul>
      <li><a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">خانه</a></li>
      <li><a href="{{ url_for('lessons') }}" class="{{ 'active' if request.endpoint == 'lessons' }}">درس‌ها</a></li>
      <li><a href="{{ url_for('courses') }}" class="{{ 'active' if request.endpoint == 'courses' }}">دوره‌ها</a></li>
      <li><a href="{{ url_for('contact') }}" class="{{ 'active' if request.endpoint == 'contact' }}">تماس با ما</a></li>
    </ul>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <p>Designed with ❤️ by Rezvane Akbari</p>
  <p>All rights reserved © 2026 Studyhub</p>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
